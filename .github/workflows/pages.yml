name: Deploy map to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Optional: rebuild site/data/ from a fresh FCC file instead of the committed
      # data.  Set the repository variable FCC_DATA_URL (Settings -> Secrets and
      # variables -> Actions -> Variables) to a URL of the FCC "California / Fiber
      # to the Premises" availability zip.  Census blocks are fetched from TIGERweb.
      - name: Rebuild map data from FCC_DATA_URL
        if: vars.FCC_DATA_URL != ''
        env:
          FCC_DATA_URL: ${{ vars.FCC_DATA_URL }}
        run: |
          mkdir -p data/raw
          curl -sSfL "$FCC_DATA_URL" -o "data/raw/$(basename "$FCC_DATA_URL")"
          python scripts/fetch_blocks.py
          python scripts/build_map.py

      # Building footprints are not committed (about 200 MB). They are generated here
      # from DataSF (San Francisco) and Overture Maps (other counties) and cached; bump
      # the key's version suffix to force a rebuild.
      - name: Restore cached building footprints
        id: bldg-cache
        uses: actions/cache@v4
        with:
          path: site/data/buildings
          key: buildings-${{ hashFiles('scripts/fetch_buildings.py', 'scripts/fetch_blocks.py') }}-v1

      - name: Build building footprints
        if: steps.bldg-cache.outputs.cache-hit != 'true'
        run: |
          pip install overturemaps
          python scripts/fetch_blocks.py
          python scripts/fetch_buildings.py

      - name: Check the site has data
        run: test -s site/data/overview.js && test -s site/data/blocks/index.json && test -s site/data/buildings/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only the default branch is published; other branches just build and test.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
